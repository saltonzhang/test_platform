services:
  db:
    image: mysql:8.4
    restart: unless-stopped
    env_file: ${ENV_FILE:-.env.production}
    volumes:
      - aibet_mysql_data:/var/lib/mysql
      - ./test_aibetauto.sql:/docker-entrypoint-initdb.d/01-test_aibetauto.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -uroot -p$$MYSQL_ROOT_PASSWORD"]
      interval: 10s
      timeout: 5s
      retries: 12

  backend:
    build: ./backend
    restart: unless-stopped
    env_file: ${ENV_FILE:-.env.production}
    environment:
      MYSQL_HOST: db
      MYSQL_PORT: 3306
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build: ./frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "172.17.0.1:18081:80"

volumes:
  aibet_mysql_data:
